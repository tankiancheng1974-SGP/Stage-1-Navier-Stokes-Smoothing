name: Run Code Verifications

on:
  push:
    branches: [ main, master, workflows ]

jobs:
  verify-python:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install numpy

    - name: Run Telemetry Script
      run: |
        python kctan_smoothing.py
